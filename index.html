function toast(message,type='ok'){const root=document.querySelector('#toast-root');root.innerHTML=`<div class="toast ${type==='error'?'error':''}">${ic(type==='error'?'alert':'check')} ${esc(message)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>root.innerHTML='',3800)}
const property=id=>db.properties.find(p=>p.id===id);const inspection=id=>db.inspections.find(i=>i.id===id);const fullAddress=p=>p?`${p.address||''}${p.number?', '+p.number:''}${p.district?' · '+p.district:''}${p.city?' · '+p.city:''}${p.state?'/'+p.state:''}`:'Imóvel removido';

function statusMeta(s){return{finished:['Concluída','finished'], 'in-progress':['Em andamento','in-progress'],pending:['Pendente','pending']}[s]||['Pendente','pending']}

if(state.mobile){document.getElementById('shade')?.remove();let overlay=document.createElement('div');overlay.className='mobile-shade';overlay.id='shade';overlay.dataset.action='menu';document.body.append(overlay)}else document.getElementById('shade')?.remove();
const tabs=[['dashboard','Início','home'],['properties','Imóveis','building'],['inspections','Vistorias','clipboard'],['people','Contatos','users'],['more','Mais','menu']];

function pageIntro(eyebrow,title,subtitle,actions=''){return `<div class="intro"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${subtitle}</p></div><div class="actions">${actions}</div></div>`}

function metrics(){let complete=db.inspections.filter(i=>i.status==='finished').length,active=db.inspections.filter(i=>i.status==='in-progress').length,pending=db.inspections.filter(i=>i.status==='pending').length;return [{label:'Imóveis cadastrados',value:db.properties.length,icon:'building',cls:'',note:'No seu portfólio atual'},{label:'Total de vistorias',value:db.inspections.length,icon:'clipboard',cls:'blue',note:'Em todo o histórico'},{label:'Em andamento',value:active,icon:'clock',cls:'gold',note:'Aguardando finalização'},{label:'Vistorias concluídas',value:complete,icon:'check',cls:'purple',note:`${pending} pendente(s) de início`}].map(x=>`<div class="card metric"><div class="metric-top"><span class="metric-label">${x.label}</span><div class="metric-icon ${x.cls}">${ic(x.icon)}</div></div><strong class="metric-num">${x.value}</strong><div class="metric-note">${x.note}</div></div>`).join('')}
function dashboard(){let complete=db.inspections.filter(x=>x.status==='finished').length,active=db.inspections.filter(x=>x.status==='in-progress').length,percent=db.inspections.length?Math.round(100*complete/db.inspections.length):0,arr=[5,4,3,2,1,0].map(n=>{let d=new Date();d.setDate(1);d.setMonth(d.getMonth()-n);let label=d.toLocaleDateString('pt-BR',{month:'short'}).replace('.','');let count=db.inspections.filter(i=>{let q=new Date(i.date+'T12:00:00');return q.getMonth()===d.getMonth()&&q.getFullYear()===d.getFullYear()}).length;return {label,count}});let max=Math.max(3,...arr.map(x=>x.count));return `${pageIntro('Bem-vindo ao ImobiCheck','Seu painel de controle','Acompanhe seus imóveis e gerencie suas vistorias com agilidade.',b('new-inspection','Nova vistoria','plus','btn btn-primary'))}${demoBanner()}<div class="metrics">${metrics()}</div><div class="dashboard-grid"><div class="card"><div class="card-head"><div><h3>Volume de vistorias</h3><p>Registros realizados nos últimos 6 meses</p></div>${ic('more')}</div><div class="overview-chart"><div class="chart-area"><div class="y-labels"><span>${max}</span><span>${Math.round(max*.66)}</span><span>${Math.round(max*.33)}</span><span>0</span></div>${arr.map(o=>`<div class="bar-col"><div class="bar" style="height:${o.count/max*100}%" title="${o.count} vistoria(s)"></div><em>${esc(o.label)}</em></div>`).join('')}</div><div class="chart-foot"><span><i class="legend-dot"></i> Vistorias no mês</span></div></div></div><div class="card"><div class="card-head"><div><h3>Desempenho das vistorias</h3><p>Taxa geral de conclusão</p></div></div><div class="progress-card"><div class="progress-ring"><svg viewBox="0 0 160 160"><circle class="ring-bg" cx="80" cy="80" r="65"/><circle class="ring-fill" cx="80" cy="80" r="65" stroke-dasharray="${408.4*percent/100} 408.4"/></svg><div class="ring-text"><strong>${percent}%</strong><span>Concluídas</span></div></div><div class="progress-stats"><div><strong>${complete}</strong><span>Finalizadas</span></div><div><strong>${active}</strong><span>Em andamento</span></div></div></div></div></div><div class="card listing-panel"><div class="section-head"><div><h3>Vistorias recentes</h3><p>Últimas atualizações do seu portfólio</p></div><button class="link-action" data-action="navigate" data-page="inspections">Ver todas ${ic('arrow')}</button></div>${inspectionTable([...db.inspections].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5))}</div>`}
function inspectionTable(arr){return !arr.length?`<div class="empty">${ic('clipboard')}<h4>Nenhuma vistoria encontrada</h4><p>Cadastre seu primeiro imóvel e inicie uma vistoria completa.</p>${b('new-inspection','Nova vistoria','plus','btn btn-primary')}</div>`:`<div class="table-scroll"><table class="table"><thead><tr><th>Imóvel</th><th>Tipo</th><th>Data</th><th>Progresso</th><th>Status</th><th style="text-align:right">Ações</th></tr></thead><tbody>${arr.map(i=>{let p=property(i.propertyId),pr=calcProgress(i);return `<tr><td><span class="main-cell">${esc(p?.title||'Imóvel excluído')}</span><div class="muted" style="margin-top:4px">${esc(p?.city||'')} · ${esc(p?.code||'')}</div></td><td>${esc(i.type)}</td><td>${fmtDate(i.date)}</td><td><div style="width:95px"><div class="progress-track" style="height:5px;margin:0 0 5px"><div style="width:${pr.percent}%"></div></div><span class="muted">${pr.percent}%</span></div></td><td>${pill(i.status)}</td><td><div class="mini-actions"><button title="Abrir vistoria" data-action="open-inspection" data-id="${i.id}">${ic('eye')}</button><button title="Gerar laudo HTML" data-action="report" data-id="${i.id}">${ic('file')}</button><button title="Excluir" data-action="delete-inspection" data-id="${i.id}">${ic('trash')}</button></div></td></tr>`}).join('')}</tbody></table></div>`}
function propertyCard(p,index){let inspectionsCount=db.inspections.filter(x=>x.propertyId===p.id).length;return `<div class="card property-card"><div class="property-visual bg${index%3+1}">${ic('home')}${p.cover?`<img src="${esc(p.cover)}" alt="Foto do imóvel">`:''}<span class="property-type">${esc(p.type)}</span></div><div class="property-body"><h3>${esc(p.title)}</h3><p class="property-address">${ic('pin')} ${esc(fullAddress(p))}</p><div class="property-info"><span>${ic('ruler')}${esc(p.area||'—')} m²</span><span>${ic('bed')}${esc(p.bedrooms||'—')} quarto(s)</span><span>${ic('clipboard')}${inspectionsCount} vistoria(s)</span></div><div class="property-actions"><span class="property-code">REF. ${esc(p.code)}</span><div class="actions">${b('edit-property','Editar','edit','btn btn-xs',`data-id="${p.id}"`)}${b('new-inspection','Vistoriar','plus','btn btn-primary btn-xs',`data-property="${p.id}"`)}</div></div></div></div>`}
function propertiesPage(){let arr=db.properties.filter(p=>{let q=state.query.toLowerCase();return [p.title,p.address,p.city,p.district,p.code,p.owner].join(' ').toLowerCase().includes(q)&&(state.filter==='all'||p.type===state.filter)});let types=['all',...new Set(db.properties.map(p=>p.type))];return `${pageIntro('Portfólio imobiliário','Gestão de imóveis','Organize propriedades, proprietários e histórico de vistorias.',b('new-property','Cadastrar imóvel','plus','btn btn-primary'))}${demoBanner()}<div class="toolbar"><div class="filter-pills">${types.map(t=>`<button class="${state.filter===t?'active':''}" data-action="filter" data-filter="${esc(t)}">${t==='all'?'Todos':esc(t)}</button>`).join('')}</div><span class="subtle">${arr.length} imóvel(is) encontrado(s)</span></div>${arr.length?`<div class="property-grid">${arr.map(propertyCard).join('')}</div>`:`<div class="card empty">${ic('building')}<h4>Nenhum imóvel encontrado</h4><p>Adicione um imóvel ou ajuste sua pesquisa.</p>${b('new-property','Cadastrar imóvel','plus','btn btn-primary')}</div>`}`}
function inspectionsPage(){let arr=db.inspections.filter(i=>{let q=state.query.toLowerCase();return [property(i.propertyId)?.title,i.type,i.inspector,i.tenant].join(' ').toLowerCase().includes(q)&&(state.filter==='all'||i.status===state.filter)}).sort((a,b)=>b.date.localeCompare(a.date));return `${pageIntro('Controle de inspeções','Vistorias imobiliárias','Documente as condições de cada ambiente e gere laudos profissionais.',b('new-inspection','Nova vistoria','plus','btn btn-primary'))}${demoBanner()}<div class="toolbar"><div class="filter-pills">${[['all','Todas'],['pending','Pendentes'],['in-progress','Em andamento'],['finished','Concluídas']].map(([key,name])=>`<button class="${state.filter===key?'active':''}" data-action="filter" data-filter="${key}">${name}</button>`).join('')}</div><span class="subtle">${arr.length} vistoria(s)</span></div><div class="card listing-panel">${inspectionTable(arr)}</div>`}
function peoplePage(){let a=db.people.filter(p=>[p.name,p.email,p.phone,p.type].join(' ').toLowerCase().includes(state.query.toLowerCase()));return `${pageIntro('Relacionamentos','Contatos','Cadastre proprietários, locatários, corretores e demais participantes.',b('new-person','Adicionar contato','plus','btn btn-primary'))}${demoBanner()}${a.length?`<div class="contact-list">${a.map(p=>`<div class="card contact-card"><div class="contact-avatar">${esc(p.name.split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase())}</div><h4>${esc(p.name)}</h4><p>${esc(p.type)}</p><div class="contact-line">${ic('mail')}${esc(p.email||'E-mail não informado')}</div><div class="contact-line">${ic('phone')}${esc(p.phone||'Telefone não informado')}</div><div class="actions" style="margin-top:16px">${b('edit-person','Editar','edit','btn btn-xs',`data-id="${p.id}"`)}${b('delete-person','Excluir','trash','btn btn-danger btn-xs',`data-id="${p.id}"`)}</div></div>`).join('')}</div>`:`<div class="card empty">${ic('users')}<h4>Nenhum contato encontrado</h4><p>Cadastre os participantes relacionados aos imóveis e vistorias.</p>${b('new-person','Adicionar contato','plus','btn btn-primary')}</div>`}`}
function reportsPage(){let arr=db.inspections.filter(x=>[property(x.propertyId)?.title,x.inspector,x.type].join(' ').toLowerCase().includes(state.query.toLowerCase())).sort((a,b)=>b.date.localeCompare(a.date));return `${pageIntro('Documentação','Central de relatórios','Gere, imprima e arquive laudos de vistoria por imóvel.',b('export-csv','Exportar planilha','download','btn'))}${demoBanner()}<div class="card listing-panel"><div class="section-head"><div><h3>Laudos disponíveis</h3><p>Os laudos são construídos a partir das informações registradas.</p></div></div>${arr.length?`<div class="table-scroll"><table class="table"><thead><tr><th>Imóvel</th><th>Vistoria</th><th>Data</th><th>Status</th><th>Ações</th></tr></thead><tbody>${arr.map(i=>`<tr><td><span class="main-cell">${esc(property(i.propertyId)?.title||'Imóvel removido')}</span></td><td>${esc(i.type)}</td><td>${fmtDate(i.date)}</td><td>${pill(i.status)}</td><td><div class="actions">${b('report','Baixar HTML','download','btn btn-xs',`data-id="${i.id}"`)}${b('print-report','Imprimir / PDF','printer','btn btn-xs btn-soft',`data-id="${i.id}"`)}</div></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">${ic('file')}<h4>Nenhum laudo disponível</h4><p>Crie uma vistoria para emitir um relatório.</p></div>`}</div><div class="note" style="margin-top:18px">${ic('info')} Para gerar um PDF, clique em <b>Imprimir / PDF</b> e selecione “Salvar como PDF” no diálogo de impressão do navegador. O laudo inclui observações, estados, fotografias e assinatura, quando registrada.</div>`}
function settingsPage(){return `${pageIntro('Preferências','Configurações','Personalize a identidade da empresa e gerencie seus backups.')}${demoBanner()}<div class="settings-grid"><div class="card form-card"><div class="section-head"><div><h3>Dados da empresa</h3><p>Exibidos nos laudos e relatórios.</p></div>${ic('briefcase')}</div><form id="settings-form" class="field-grid"><div class="field span-2"><label>Nome da imobiliária / empresa</label><input name="company" value="${esc(db.settings.company)}" required></div><div class="field"><label>Responsável</label><input name="responsible" value="${esc(db.settings.responsible)}"></div><div class="field"><label>CPF / CNPJ</label><input name="document" value="${esc(db.settings.document)}"></div><div class="field"><label>E-mail</label><input name="email" type="email" value="${esc(db.settings.email)}"></div><div class="field"><label>Telefone</label><input name="phone" value="${esc(db.settings.phone)}"></div><div class="field span-2"><label>Logotipo (opcional; armazenado localmente)</label><input type="file" id="logo-input" accept="image/*"></div>${db.settings.logo?`<div class="span-2" style="padding:12px;border:1px solid #e9eef2;border-radius:8px"><img class="logo-img" src="${esc(db.settings.logo)}" alt="Logo"></div>`:''}<div class="span-2">${b('submit-settings','Salvar alterações','check','btn btn-primary','type="submit"')}</div></form></div><div><div class="card form-card"><div class="section-head"><div><h3>Dados e segurança</h3><p>Privacidade e portabilidade de dados.</p></div>${ic('shield')}</div><div class="note">Este sistema funciona localmente. Os dados são salvos no navegador, não enviados para servidores. Apagar os dados do site ou trocar de dispositivo pode eliminar seus registros.</div><div class="rule"></div><div style="display:grid;gap:9px">${b('backup','Exportar backup JSON','download','btn btn-primary')}${b('import','Restaurar backup JSON','upload','btn')}${b('export-csv','Exportar vistorias CSV','file','btn')}${b('clear-all','Apagar todos os registros','trash','btn btn-danger')}</div><input type="file" id="import-file" accept=".json,application/json" style="display:none"></div><div class="card form-card" style="margin-top:18px"><h3 style="font-size:14px;margin:0 0 12px">Sobre esta edição</h3><div class="stat-item">ImobiCheck Premium · HTML independente, versão 1.0</div><p class="subtle" style="line-height:1.7">Aplicação offline de referência, sem autenticação, banco em nuvem, sincronização multiusuário ou assinatura digital certificada. Não reproduz necessariamente o código nem as telas do aplicativo Lovable.</p></div></div></div>`}
function editorPage(){let i=inspection(state.activeInspection);if(!i){state.page='inspections';return inspectionsPage()}let p=property(i.propertyId),progress=calcProgress(i);if(!i.rooms.length)i.rooms=[];let room=i.rooms.find(r=>r.id===state.activeRoom)||i.rooms[0];state.activeRoom=room?.id||null;let defects=i.rooms.flatMap(r=>r.items).filter(item=>item.condition==='Ruim').length;return `${pageIntro('Vistoria / '+esc(i.type),esc(p?.title||'Imóvel não encontrado'),esc(fullAddress(p)),`${b('navigate','Voltar','chevleft','btn','data-page="inspections"')}${b('edit-inspection','Editar dados','edit','btn',`data-id="${i.id}"`)}${b('print-report','Imprimir laudo','printer','btn btn-primary',`data-id="${i.id}"`)}`)}<div class="detail-grid"><div class="card detail-tile"><small>Data da vistoria</small><strong>${fmtDate(i.date)}</strong></div><div class="card detail-tile"><small>Andamento do checklist</small><strong>${progress.done} de ${progress.total} itens (${progress.percent}%)</strong><div class="progress-track"><div style="width:${progress.percent}%"></div></div></div><div class="card detail-tile"><small>Status atual</small><div style="margin-top:10px">${pill(i.status)}</div></div></div><div class="split"><aside class="card room-sidebar"><h4>AMBIENTES DO IMÓVEL</h4>${i.rooms.map(r=>{let total=r.items.length,done=r.items.filter(x=>x.condition).length;return `<button class="room-link ${r.id===state.activeRoom?'active':''}" data-action="select-room" data-id="${r.id}"><span>${esc(r.name)}</span><span class="count">${done}/${total}</span></button>`}).join('')}${b('add-room','Novo ambiente','plus','btn btn-soft btn-xs',`style="width:100%;margin-top:10px"`)}</aside><div class="card editor-card">${room?`<div class="editor-top"><div><div class="eyebrow">CHECKLIST POR AMBIENTE</div><h2>${esc(room.name)}</h2><p>Inspecione cada item e registre as evidências.</p></div><div class="actions">${b('rename-room','Renomear','edit','btn btn-xs')}${b('delete-room','Excluir','trash','btn btn-danger btn-xs')}</div></div>${room.items.map(item=>`<div class="room-item" id="item-${item.id}"><div class="room-item-head"><strong>${esc(item.name)}</strong><button class="icon-btn" data-action="delete-item" data-item="${item.id}" title="Remover item" style="height:27px;width:27px">${ic('x')}</button></div><div class="conditions">${[['Bom','good'],['Regular','regular'],['Ruim','bad'],['Não se aplica','na']].map(([value,cl])=>`<button class="condition ${item.condition===value?'selected '+cl:''}" data-action="condition" data-item="${item.id}" data-value="${value}">${value}</button>`).join('')}</div><div class="field"><label>Observações</label><textarea data-role="item-notes" data-item="${item.id}" placeholder="Descreva o estado do item, danos encontrados e detalhes relevantes...">${esc(item.notes)}</textarea></div><div class="photo-strip">${(item.photos||[]).map((src,j)=>`<div class="photo"><img src="${esc(src)}" alt="Fotografia do item ${esc(item.name)}"><button class="photo-zoom" data-action="preview-photo" data-item="${item.id}" data-photo="${j}" aria-label="Ampliar fotografia"></button><button data-action="remove-photo" data-item="${item.id}" data-photo="${j}" aria-label="Excluir fotografia" title="Remover imagem">×</button></div>`).join('')}</div><div class="media-actions"><label class="upload-photo camera-capture">${ic('camera')}<span>Tirar foto</span><input type="file" accept="image/*" capture="environment" data-role="photo-input" data-item="${item.id}" aria-label="Abrir câmera do iPhone ou iPad"></label><label class="upload-photo">${ic('image')}<span>Da galeria</span><input type="file" accept="image/*" multiple data-role="photo-input" data-item="${item.id}" aria-label="Selecionar fotos da galeria"></label></div></div>`).join('')}${b('add-item','Adicionar item a este ambiente','plus','btn btn-soft','style="width:100%"')}<div class="field" style="margin-top:20px"><label>Observações gerais do ambiente</label><textarea data-role="room-notes" data-room="${room.id}" placeholder="Descreva observações que se aplicam ao cômodo como um todo...">${esc(room.notes||'')}</textarea></div>`:`<div class="empty">${ic('layers')}<h4>Nenhum ambiente cadastrado</h4><p>Adicione o primeiro ambiente para começar a inspeção.</p>${b('add-room','Adicionar ambiente','plus','btn btn-primary')}</div>`}<div class="editor-bottom"><span class="last-save">${ic('shield')} Salvamento automático no navegador</span><div class="actions">${b('status-progress','Em andamento','clock','btn',`data-id="${i.id}"`)}${b('finish-inspection','Concluir vistoria','check','btn btn-primary',`data-id="${i.id}"`)}</div></div></div></div><div class="card editor-card" style="margin-top:18px"><div class="section-head"><div><h3>Informações complementares e assinatura</h3><p>Informações exibidas no laudo final.</p></div>${b('clear-signature','Limpar assinatura','refresh','btn btn-xs')}</div><div class="field"><label>Observações gerais da vistoria</label><textarea data-role="inspection-notes" data-id="${i.id}" placeholder="Descreva ocorrências, ressalvas e recomendações...">${esc(i.notes||'')}</textarea></div><div style="margin-top:19px"><div class="field" style="margin-bottom:8px"><label>Assinatura desenhada (opcional)</label></div><div class="sign-box" id="signature-box"><canvas id="signature-canvas" width="900" height="300"></canvas><span class="sign-hint">Assine com o dedo ou Apple Pencil</span></div><p class="subtle" style="margin-top:8px">Assinatura simples para registro visual, sem validação jurídica de identidade.</p></div></div><div class="note note-warning" style="margin-top:17px">${ic('info')} Itens marcados como <b>Ruim</b>: ${defects}. Confira as observações e fotografias antes de finalizar. O laudo só apresenta as informações que você registrar.</div>`}

async function shareBackupMobile(){
 const name='imobicheck-backup-'+today()+'.json';
 const content=JSON.stringify({...db,exportedAt:new Date().toISOString(),schemaVersion:1},null,2);
 try{
  if(typeof File==='function' && typeof navigator.share==='function' && typeof navigator.canShare==='function'){
   let file=new File([content],name,{type:'application/json'});
   if(navigator.canShare({files:[file]})){
    await navigator.share({files:[file],title:'Backup ImobiCheck'});
    toast('Compartilhamento do backup concluído. Confira se ele foi salvo em Arquivos ou iCloud.');
    return;
   }
  }
 }catch(err){if(err.name==='AbortError')return;}
 downloadText(name,content,'application/json');toast('Backup exportado. Salve o arquivo no app Arquivos.');
}
function highlightRoom(){
 if(state.page!=='editor')return;
 requestAnimationFrame(()=>{const room=document.querySelector('.room-sidebar .room-link.active');if(room&&window.innerWidth<=720)room.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});});
}

function render(){renderChrome();document.querySelector('#app').innerHTML=({dashboard,properties:propertiesPage,inspections:inspectionsPage,people:peoplePage,reports:reportsPage,settings:settingsPage,editor:editorPage}[state.page]||dashboard)();if(state.page==='editor'){initSignature();highlightRoom();}}
function navigate(page){state.page=page;state.filter='all';state.query='';state.mobile=false;state.searchOpen=false;window.scrollTo({top:0,behavior:'instant'});render()}

if(kind==='inspection'&&!db.properties.length){state.modal=null;toast('Cadastre um imóvel antes de iniciar uma vistoria.','error');openModal('property');return}
state.modal={kind,id};document.querySelector('#modal-root').innerHTML=`<div class="modal-backdrop" id="modal-backdrop"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><div><h2>${esc(title)}</h2><p>${esc(subtitle)}</p></div><button class="close-modal" data-action="close-modal" title="Fechar">${ic('x')}</button></div><form id="entity-form"><div class="modal-body"><div class="field-grid">${fields}</div></div><div class="modal-footer">${b('close-modal','Cancelar','','btn','type="button"')}<button type="submit" class="btn btn-primary">${ic('check')} ${id?'Salvar alterações':'Cadastrar'}</button></div></form></div></div>`;document.body.classList.add('modal-open');if(window.innerWidth>720)document.querySelector('.modal input:not([type=hidden])')?.focus()}
function closeModal(){state.modal=null;document.body.classList.remove('modal-open');document.querySelector('#modal-root').innerHTML=''}
async function submitEntity(form){if(!state.modal)return;let{kind,id}=state.modal,values=Object.fromEntries(new FormData(form));if(kind==='property'){let current=db.properties.find(x=>x.id===id),newItem={id:id||uid(),created:current?.created||today(),cover:current?.cover||''};for(let key of ['title','type','code','address','number','district','city','state','zip','area','bedrooms','bathrooms','owner','notes'])newItem[key]=String(values[key]||'').trim();if(!newItem.code)newItem.code='IMO-'+String(db.properties.length+1).padStart(3,'0');let f=form.querySelector('[name=coverFile]')?.files[0];if(f){try{newItem.cover=await compressImage(f,980,.76)}catch{toast('Não foi possível processar a foto.','error')}}if(current)Object.assign(current,newItem);else db.properties.unshift(newItem);save();toast(id?'Imóvel atualizado.':'Imóvel cadastrado.');if(!id)state.page='properties'}else if(kind==='person'){let current=db.people.find(x=>x.id===id),newItem={id:id||uid()};for(let k of ['name','type','phone','email','notes'])newItem[k]=String(values[k]||'').trim();if(current)Object.assign(current,newItem);else db.people.unshift(newItem);save();toast(id?'Contato atualizado.':'Contato cadastrado.');state.page='people'}else if(kind==='inspection'){let current=db.inspections.find(x=>x.id===id),newItem={id:id||uid(),created:current?.created||today(),status:current?.status||'pending',rooms:current?.rooms||makeRooms(),signature:current?.signature||''};for(let k of ['propertyId','type','date','inspector','tenant','notes'])newItem[k]=String(values[k]||'').trim();if(id)newItem.status=values.status||newItem.status;if(current)Object.assign(current,newItem);else db.inspections.unshift(newItem);save();toast(id?'Vistoria atualizada.':'Vistoria criada.');state.activeInspection=newItem.id;state.activeRoom=newItem.rooms[0]?.id;state.page='editor'}closeModal();render()}
function getRoomItem(id){let i=inspection(state.activeInspection);if(!i)return{};for(let r of i.rooms){let item=r.items.find(x=>x.id===id);if(item)return {room:r,item,inspection:i}}return {}}
function qsetStatus(status){let i=inspection(state.activeInspection);if(!i)return;i.status=status;save();toast(status==='finished'?'Vistoria concluída.':'Status atualizado.');render()}
function makeReport(i){let p=property(i.propertyId)||{},s=db.settings,pr=calcProgress(i),faults=i.rooms.flatMap(r=>r.items.filter(x=>x.condition==='Ruim').map(x=>`${r.name}: ${x.name}`));let html=`<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><title>Laudo ${esc(p.code||i.id)}</title><style>*{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;color:#223445;margin:0;background:#f4f6f7;font-size:12px;line-height:1.55}.paper{background:#fff;margin:24px auto;max-width:900px;padding:42px;box-shadow:0 5px 30px #0001}.header{border-bottom:3px solid #119a81;padding-bottom:20px;display:flex;justify-content:space-between;gap:18px;align-items:center}.logo{height:50px;max-width:180px;object-fit:contain}.company{font-weight:800;font-size:18px;color:#123446}.sub{color:#8998a7;font-size:11px;margin-top:4px}h1{font-size:25px;margin:30px 0 10px}h2{font-size:15px;color:#117f6e;background:#eff8f5;padding:10px 13px;border-radius:6px;margin:30px 0 12px}h3{font-size:13px;margin:19px 0 10px}table{width:100%;border-collapse:collapse;margin:14px 0}th,td{border-bottom:1px solid #e6eaee;text-align:left;padding:10px 9px;vertical-align:top}th{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:#8694a2;background:#f6f8fa}.badge{display:inline-block;padding:3px 9px;border-radius:6px;background:#e5f7ee;color:#087a5d;font-weight:700}.badge.ruim{background:#ffeded;color:#b7414f}.badge.regular{background:#fff1dc;color:#a56b18}.badge.na{background:#edf1f4;color:#5e7185}.keygrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.keygrid div{border-bottom:1px solid #e9edf0;padding:9px 0}.keygrid strong{display:block;color:#8799a7;font-size:10px}.photos{display:flex;flex-wrap:wrap;gap:10px}.photos img{width:190px;max-height:175px;object-fit:contain;border:1px solid #e6ebee;border-radius:6px}.note{padding:13px;border:1px solid #e4eae8;background:#f9fcfa;border-radius:7px;white-space:pre-wrap}.signature{width:240px;max-height:115px;object-fit:contain;border-bottom:1px solid #687886;margin-bottom:4px}.footer{border-top:1px solid #e4e9ed;margin-top:38px;padding-top:12px;color:#9aa6af;font-size:10px}.cover{margin-bottom:25px}.muted{color:#81909d}.no-break{break-inside:avoid;page-break-inside:avoid}@page{size:A4;margin:14mm}@media print{body{background:#fff}.paper{box-shadow:none;margin:0;max-width:100%;padding:0}h2{print-color-adjust:exact;-webkit-print-color-adjust:exact}.badge{print-color-adjust:exact;-webkit-print-color-adjust:exact}}</style></head><body><main class="paper"><div class="header"><div>${s.logo?`<img class="logo" src="${esc(s.logo)}" alt="Logo"><br>`:''}<div class="company">${esc(s.company||'ImobiCheck')}</div><div class="sub">${esc(s.document||'')} ${s.phone?' · '+esc(s.phone):''} ${s.email?' · '+esc(s.email):''}</div></div><div style="text-align:right"><strong style="font-size:17px;color:#118e79">IMOBICHECK</strong><div class="sub">RELATÓRIO DE VISTORIA</div></div></div><div class="cover"><h1>Laudo de vistoria de ${esc(i.type.toLowerCase())}</h1><div class="muted">Emissão: ${new Date().toLocaleDateString('pt-BR')} · Código do imóvel: ${esc(p.code||'—')} · Inspeção: ${esc(i.id)}</div></div><h2>1. Identificação</h2><div class="keygrid"><div><strong>IMÓVEL</strong>${esc(p.title||'Imóvel removido')}</div><div><strong>LOCALIZAÇÃO</strong>${esc(fullAddress(p))}</div><div><strong>DATA DA VISTORIA</strong>${fmtDate(i.date)}</div><div><strong>MODALIDADE</strong>${esc(i.type)}</div><div><strong>VISTORIADOR</strong>${esc(i.inspector||'Não informado')}</div><div><strong>LOCATÁRIO / OCUPANTE</strong>${esc(i.tenant||'Não informado')}</div><div><strong>PROPRIETÁRIO</strong>${esc(p.owner||'Não informado')}</div><div><strong>ANDAMENTO</strong>${pr.done} de ${pr.total} itens (${pr.percent}%) · ${statusMeta(i.status)[0]}</div></div><h2>2. Detalhamento dos ambientes</h2>${i.rooms.map((r,k)=>`<section><h3>${k+1}. ${esc(r.name)}</h3>${r.items.length?`<table><thead><tr><th style="width:34%">Item</th><th style="width:20%">Condição</th><th>Observações</th></tr></thead><tbody>${r.items.map(x=>`<tr><td>${esc(x.name)}</td><td><span class="badge ${x.condition==='Ruim'?'ruim':x.condition==='Regular'?'regular':x.condition==='Não se aplica'?'na':''}">${esc(x.condition||'Não avaliado')}</span></td><td>${esc(x.notes||'—')}</td></tr>${(x.photos||[]).length?`<tr><td colspan="3"><div class="photos">${x.photos.map(src=>`<img src="${esc(src)}" alt="Evidência fotográfica">`).join('')}</div></td></tr>`:''}`).join('')}</tbody></table>`:'<p class="muted">Sem itens cadastrados.</p>'}${r.notes?`<p class="note">${esc(r.notes)}</p>`:''}</section>`).join('')}<h2>3. Resumo e ressalvas</h2><p><b>Pontos classificados como ruins:</b> ${faults.length?esc(faults.join(' · ')):'Nenhum item classificado como ruim.'}</p><div class="note">${esc(i.notes||'Nenhuma observação geral registrada.')}</div><h2>4. Registro de ciência</h2>${i.signature?`<img src="${esc(i.signature)}" class="signature" alt="Assinatura registrada"><div class="muted">Assinatura desenhada digitalmente no dispositivo</div>`:'<p style="padding:32px 0;border-bottom:1px solid #8998a5;width:300px"></p><div class="muted">Assinatura</div>'}<p class="muted" style="margin-top:22px">Este documento reflete os registros realizados pelo responsável. Assinaturas simples e imagens não constituem, por si, certificação digital de identidade ou autenticidade.</p><div class="footer">Laudo gerado por ImobiCheck Premium (edição local) · ${new Date().toLocaleString('pt-BR')} · Documento para conferência.</div></main></body></html>`;return html}
function downloadText(name,content,mime='text/plain;charset=utf-8'){let blob=new Blob([content],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),15000)}
function backup(){return shareBackupMobile()}
function exportCSV(){const rows=[['ID','Data','Imóvel','Código','Tipo','Vistoriador','Ocupante','Status','Itens avaliados','Itens totais','Percentual'],...db.inspections.map(i=>{let p=property(i.propertyId),x=calcProgress(i);return[i.id,i.date,p?.title||'',p?.code||'',i.type,i.inspector,i.tenant,statusMeta(i.status)[0],x.done,x.total,x.percent+'%']})];let protect=v=>{let s=String(v??'');if(/^[=+@\-\t\r]/.test(s))s="'"+s;return'"'+s.replace(/"/g,'""')+'"'};downloadText('imobicheck-vistorias-'+today()+'.csv','\ufeff'+rows.map(row=>row.map(protect).join(';')).join('\r\n'),'text/csv;charset=utf-8');toast('CSV exportado com sucesso.')}
async function compressImage(file,max=960,quality=.72){if(!file.type.startsWith('image/'))throw Error('Arquivo não é imagem');if(file.size>20*1024*1024)throw Error('Imagem muito grande');let src=await new Promise((resolve,reject)=>{let fr=new FileReader();fr.onload=()=>resolve(fr.result);fr.onerror=reject;fr.readAsDataURL(file)});let img=new Image();img.src=src;await img.decode();let scale=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);let ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);return canvas.toDataURL('image/jpeg',quality)}
async function importBackup(file){try{const raw=await file.text();if(raw.length>20*1024*1024)throw Error('Arquivo acima do limite de 20 MB');const obj=JSON.parse(raw);if(!obj||!Array.isArray(obj.properties)||!Array.isArray(obj.people)||!Array.isArray(obj.inspections)||typeof obj.settings!=='object')throw Error('Formato inválido');if(!confirm(`Restaurar ${obj.properties.length} imóveis e ${obj.inspections.length} vistorias? Os dados atuais serão substituídos. Faça backup antes de continuar.`))return;const prior=db;db={demo:false,properties:obj.properties,people:obj.people,inspections:obj.inspections,settings:{company:'Minha Imobiliária',responsible:'Administrador',email:'',phone:'',document:'',logo:'',...obj.settings},activity:Array.isArray(obj.activity)?obj.activity:[]};try{localStorage.setItem(STORE,JSON.stringify(db))}catch(e){db=prior;throw Error('Backup maior que a capacidade de armazenamento deste navegador')}navigate('dashboard');toast('Backup restaurado com sucesso.')}catch(e){toast('Não foi possível importar: '+e.message,'error')}}
function initSignature(){let i=inspection(state.activeInspection),canvas=document.getElementById('signature-canvas');if(!canvas||!i)return;let ctx=canvas.getContext('2d');ctx.strokeStyle='#132b40';ctx.lineWidth=3.6;ctx.lineJoin='round';ctx.lineCap='round';if(i.signature){let img=new Image();img.onload=()=>{if(document.getElementById('signature-canvas')===canvas)ctx.drawImage(img,0,0,canvas.width,canvas.height)};img.src=i.signature}let drawing=false,changed=false;function point(e){let r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);drawing=true;changed=true;let p=point(e);ctx.beginPath();ctx.arc(p.x,p.y,1.8,0,Math.PI*2);ctx.fillStyle='#132b40';ctx.fill();ctx.beginPath();ctx.moveTo(p.x,p.y)});canvas.addEventListener('pointermove',e=>{if(!drawing)return;let p=point(e);ctx.lineTo(p.x,p.y);ctx.stroke();ctx.beginPath();ctx.moveTo(p.x,p.y)});function end(){if(!drawing)return;drawing=false;if(changed){i.signature=canvas.toDataURL('image/png');save()}}canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end)}
function confirmRemove(label){return confirm(`Deseja realmente excluir ${label}? Esta ação não pode ser desfeita.`)}
async function action(el){let act=el.dataset.action,id=el.dataset.id,i=inspection(state.activeInspection),room=i?.rooms.find(x=>x.id===state.activeRoom);switch(act){case'navigate':closeQuickSheet();navigate(el.dataset.page);break;case'search-toggle':state.searchOpen=!state.searchOpen;renderChrome();if(state.searchOpen)document.getElementById('global-search')?.focus();break;case'quick-open':showQuickSheet();break;case'quick-close':closeQuickSheet();break;case'preview-photo':showPhotoViewer(el.dataset.item,Number(el.dataset.photo));break;case'close-photo':closePhotoViewer();break;case'menu':state.mobile=!state.mobile;renderChrome();break;case'filter':state.filter=el.dataset.filter;render();break;case'backup':backup();break;case'new-property':closeQuickSheet();openModal('property');break;case'edit-property':openModal('property',id);break;case'new-person':closeQuickSheet();openModal('person');break;case'edit-person':openModal('person',id);break;case'new-inspection':closeQuickSheet();openModal('inspection','',el.dataset.property||'');break;case'edit-inspection':openModal('inspection',id);break;case'close-modal':closeModal();break;case'open-inspection':state.activeInspection=id;state.activeRoom=inspection(id)?.rooms[0]?.id;navigate('editor');break;case'select-room':state.activeRoom=id;render();break;case'condition':{let found=getRoomItem(el.dataset.item);if(found.item){found.item.condition=found.item.condition===el.dataset.value?'':el.dataset.value;if(found.inspection.status==='pending')found.inspection.status='in-progress';save();render()}break}case'add-room':{let name=prompt('Nome do novo ambiente (ex.: Garagem, Corredor):');if(name?.trim()){let r={id:uid(),name:name.trim().slice(0,65),notes:'',items:[]};i.rooms.push(r);state.activeRoom=r.id;save();render();toast('Ambiente adicionado.')}break}case'rename-room':{if(!room)return;let name=prompt('Novo nome do ambiente:',room.name);if(name?.trim()){room.name=name.trim().slice(0,65);save();render()}break}case'delete-room':if(room&&confirmRemove('o ambiente '+room.name)){i.rooms=i.rooms.filter(x=>x.id!==room.id);state.activeRoom=i.rooms[0]?.id;save();render()}break;case'add-item':{if(!room)return;let name=prompt('Qual item deseja vistoriar neste ambiente?');if(name?.trim()){room.items.push({id:uid(),name:name.trim().slice(0,100),condition:'',notes:'',photos:[]});save();render();toast('Item adicionado ao checklist.')}break}case'delete-item':{let f=getRoomItem(el.dataset.item);if(f.item&&confirmRemove('o item '+f.item.name)){f.room.items=f.room.items.filter(x=>x.id!==f.item.id);save();render()}break}case'remove-photo':{let f=getRoomItem(el.dataset.item);if(f.item&&confirm('Remover esta fotografia?')){f.item.photos.splice(Number(el.dataset.photo),1);save();render()}break}case'clear-signature':if(i&&confirm('Apagar a assinatura registrada?')){i.signature='';save();render()}break;case'status-progress':qsetStatus('in-progress');break;case'finish-inspection':{if(!i)return;let p=calcProgress(i);if(p.percent!==100&&!confirm(`Atenção: apenas ${p.percent}% dos itens foram avaliados. Finalizar mesmo assim?`))return;qsetStatus('finished');break}case'report':{let ins=inspection(id);if(!ins)return;downloadText('laudo-'+(property(ins.propertyId)?.code||id)+'-'+ins.date+'.html',makeReport(ins),'text/html;charset=utf-8');toast('Laudo HTML gerado.');break}case'print-report':{let ins=inspection(id);if(!ins)return;let win=window.open('','_blank');if(!win){toast('Permita janelas pop-up para imprimir o laudo.','error');return}win.document.open();win.document.write(makeReport(ins));win.document.close();win.onload=()=>{setTimeout(()=>win.print(),250)};break}case'delete-inspection':{let ins=inspection(id);if(ins&&confirmRemove('a vistoria')){db.inspections=db.inspections.filter(x=>x.id!==id);save();render();toast('Vistoria excluída.')}break}case'delete-property':{let p=property(id);if(!p)return;let refs=db.inspections.filter(x=>x.propertyId===id);if(refs.length){toast('Este imóvel tem vistorias. Exclua as vistorias antes.','error');return}if(confirmRemove('o imóvel '+p.title)){db.properties=db.properties.filter(x=>x.id!==id);save();closeModal();render();toast('Imóvel excluído.')}break}case'delete-person':{let p=db.people.find(x=>x.id===id);if(p&&confirmRemove('o contato '+p.name)){db.people=db.people.filter(x=>x.id!==id);save();render();toast('Contato excluído.')}break}case'export-csv':exportCSV();break;case'import':{let f=document.querySelector('#import-file');if(!f){toast('Abra Configurações para restaurar um backup.');navigate('settings');return}f.click();break}case'clear-demo':if(confirm('Remover todos os dados fictícios e começar com o banco vazio?')){db={...seed(),demo:false,properties:[],people:[],inspections:[]};save();navigate('dashboard');toast('Área de demonstração limpa.')}break;case'clear-all':if(confirm('Excluir TODOS os imóveis, contatos, vistorias e fotos deste navegador? A operação não pode ser desfeita.')&&confirm('Última confirmação: deseja apagar todos os registros?')){db={demo:false,properties:[],people:[],inspections:[],settings:{company:'Minha Imobiliária',responsible:'Administrador',document:'',phone:'',email:'',logo:''},activity:[]};save();navigate('dashboard');toast('Dados locais apagados.')}break}}
document.addEventListener('click',e=>{let el=e.target.closest('[data-action]');if(el){if(el.tagName==='BUTTON'&&el.getAttribute('type')==='submit')return;e.preventDefault();action(el)}if(e.target.id==='modal-backdrop')closeModal()});
document.addEventListener('submit',e=>{if(e.target.id==='entity-form'){e.preventDefault();submitEntity(e.target)}else if(e.target.id==='settings-form'){e.preventDefault();const f=e.target,data=Object.fromEntries(new FormData(f));for(const k of ['company','responsible','document','email','phone'])db.settings[k]=String(data[k]||'').trim();save();render();toast('Configurações atualizadas.')}});
document.addEventListener('change',async e=>{let el=e.target;if(el.id==='import-file'&&el.files[0]){await importBackup(el.files[0]);return}if(el.id==='logo-input'&&el.files[0]){try{db.settings.logo=await compressImage(el.files[0],480,.8);save();render();toast('Logotipo atualizado.')}catch(err){toast('Erro no logotipo: '+err.message,'error')}return}if(el.dataset.role==='photo-input'){let f=getRoomItem(el.dataset.item);if(!f.item)return;let before=f.item.photos.length;for(let file of Array.from(el.files).slice(0,8)){try{let src=await compressImage(file,1024,.7);f.item.photos.push(src)}catch(err){toast('Erro na foto: '+err.message,'error')}}el.value='';if(!save()){f.item.photos.splice(before);render();toast('Não foi possível salvar novas fotos. Faça backup e libere armazenamento.','error');return}render();toast('Fotos adicionadas. Faça backup para protegê-las.');return}if(el.dataset.role==='item-notes'){let f=getRoomItem(el.dataset.item);if(f.item){f.item.notes=el.value;save();toast('Observação salva.')}return}if(el.dataset.role==='room-notes'){let r=inspection(state.activeInspection)?.rooms.find(x=>x.id===el.dataset.room);if(r){r.notes=el.value;save();toast('Anotação do ambiente salva.')}return}if(el.dataset.role==='inspection-notes'){let i=inspection(el.dataset.id);if(i){i.notes=el.value;save();toast('Observação salva.')}}});
let qTimer,notesTimer;document.addEventListener('input',e=>{
if(['item-notes','room-notes','inspection-notes'].includes(e.target.dataset.role)){
  const el=e.target;
  clearTimeout(notesTimer);notesTimer=setTimeout(()=>{
    if(el.dataset.role==='item-notes'){let f=getRoomItem(el.dataset.item);if(f.item)f.item.notes=el.value;}
    if(el.dataset.role==='room-notes'){let r=inspection(state.activeInspection)?.rooms.find(x=>x.id===el.dataset.room);if(r)r.notes=el.value;}
    if(el.dataset.role==='inspection-notes'){let i=inspection(el.dataset.id);if(i)i.notes=el.value;}
    save();
  },500);
}
if(e.target.id==='global-search'){let val=e.target.value;clearTimeout(qTimer);qTimer=setTimeout(()=>{state.query=val;if(state.page==='dashboard'){state.page='inspections'}let pos=document.activeElement?.selectionStart;render();let input=document.getElementById('global-search');input?.focus();if(pos!==null)input?.setSelectionRange(pos,pos)},250)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(state.modal)closeModal();if(state.quickOpen)closeQuickSheet();if(state.photoView)closePhotoViewer()}});

// HTTPS PWA support. Standalone HTML continues to run without external files.
if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){
 window.addEventListener('load',()=>{navigator.serviceWorker.register('./service-worker.js').catch(()=>{});});
}

render();
</script>
